version: "3.9"

services:
  realtime-api:
    build:
      context: .
      dockerfile: ./apps/realtime-api/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      XINFERENCE_BASE_URL: ${XINFERENCE_BASE_URL:-http://host.docker.internal:9997}
      DIFY_CHAT_URL: ${DIFY_CHAT_URL:-http://host.docker.internal:88/v1/chat-messages}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      LOCAL_TTS_BASE_URL: ${LOCAL_TTS_BASE_URL:-http://local-tts:8091}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - local-tts

  local-tts:
    build:
      context: ./apps/local-tts
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      TTS_PROVIDER: ${TTS_PROVIDER:-xinference}
      PIPER_BIN: ${PIPER_BIN:-/usr/local/bin/piper}
      PIPER_MODEL_PATH: ${PIPER_MODEL_PATH:-/models/piper/zh_CN-huayan-medium.onnx}
      PIPER_CONFIG_PATH: ${PIPER_CONFIG_PATH:-/models/piper/zh_CN-huayan-medium.onnx.json}
      PIPER_NOISE_SCALE: ${PIPER_NOISE_SCALE:-0.4}
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-1.05}
      PIPER_NOISE_W: ${PIPER_NOISE_W:-0.7}
      PIPER_SENTENCE_SILENCE: ${PIPER_SENTENCE_SILENCE:-0.12}
      XINFERENCE_TTS_BASE_URL: ${XINFERENCE_TTS_BASE_URL:-http://host.docker.internal:9997}
      XINFERENCE_TTS_MODEL_UID: ${XINFERENCE_TTS_MODEL_UID:-CosyVoice-300M}
      XINFERENCE_TTS_VOICE: ${XINFERENCE_TTS_VOICE:-}
      XINFERENCE_TTS_RESPONSE_FORMAT: ${XINFERENCE_TTS_RESPONSE_FORMAT:-wav}
      XINFERENCE_TTS_SPEED: ${XINFERENCE_TTS_SPEED:-1.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/piper:/models/piper
